<mat-sidenav-container>
  <mat-sidenav-content>
    <div class="container">
      <mat-grid-list cols="5" rowHeight="700px">
        <mat-grid-tile [colspan]="1" [rowspan]="1">
          <mat-card class="example-card">
            <mat-card-header>
              <div mat-card-avatar class="example-header-image"></div>
              <mat-card-title>Shiba Inu</mat-card-title>
              <mat-card-subtitle>Dog Breed</mat-card-subtitle>
            </mat-card-header>
            <img mat-card-image src="https://material.angular.io/assets/img/examples/shiba2.jpg"
              alt="Photo of a Shiba Inu">
            <mat-card-content>
              <p>
                The Shiba Inu is the smallest of the six original and distinct spitz breeds of dog from Japan.
                A small, agile dog that copes very well with mountainous terrain, the Shiba Inu was originally
                bred for hunting.
              </p>
            </mat-card-content>
            <mat-card-actions>
              <button mat-button>LIKE</button>
              <button mat-button>SHARE</button>
            </mat-card-actions>
          </mat-card>
        </mat-grid-tile>
        <mat-grid-tile [colspan]="1" [rowspan]="1">2</mat-grid-tile>
        <mat-grid-tile [colspan]="1" [rowspan]="1">3</mat-grid-tile>
        <mat-grid-tile [colspan]="1" [rowspan]="1">4</mat-grid-tile>
        <mat-grid-tile [colspan]="1" [rowspan]="1">4</mat-grid-tile>
      </mat-grid-list>
    </div>
    <div class="aaaaa">

      <form [formGroup]="searchForm" type="submit" (submit)='filter()' class="d-inline-flex">
        <div class="row">
          <div class="col-sm-5 ">
            <mat-form-field class="flex-fill inputSearchBar" appearance="fill">
              <mat-label>Categoría</mat-label>
              <input type="text" placeholder="Categoría" aria-label="Categoría" matInput formControlName="category"
                [matAutocomplete]="auto">
              <mat-autocomplete #auto="matAutocomplete">
                <mat-option *ngFor="let option of filteredOptions | async" [value]="option">
                  {{option}}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>
          </div>
          <div class="col-sm-5 ">
            <mat-form-field class="flex-fill inputSearchBar" appearance="fill">
              <mat-label>Palabras Clave</mat-label>
              <input formControlName="keywords" #input maxlength="50" matInput placeholder="Keywords">
            </mat-form-field>
          </div>
          <div class="col-sm-2 ">
            <button mat-button color="primary" type="submit">
              Buscar<mat-icon>search</mat-icon>
            </button>
          </div>
        </div>

      </form>
    </div>

    <div *ngFor="let service of services; index as i">
      <app-service (serviceToCompare)="addServiceToCompare($event)" [service]='service' class="servicesList">
      </app-service>
    </div>
  </mat-sidenav-content>


  <mat-sidenav class="rigthPanel" opened fixedTopGap="69" [fixedInViewport]='true'
    *ngIf="(isWideScreen$ | async) && authUser" mode="side" position='end'>
    <mat-accordion>
      <mat-expansion-panel [expanded]="true">
        <mat-expansion-panel-header>
          <mat-panel-title>
            <span>
              <h2>
                Amigos
              </h2>
            </span>
          </mat-panel-title>
        </mat-expansion-panel-header>
        <mat-card *ngFor="let friend of friends">
          <mat-card-header>
            <div mat-card-avatar class="example-header-image"></div>
            <mat-card-title>
              <span class="friendName" (click)="friendProfile(friend.id)">
                {{friend.name}}
              </span>
            </mat-card-title>
          </mat-card-header>
        </mat-card>
      </mat-expansion-panel>
    </mat-accordion>
  </mat-sidenav>
</mat-sidenav-container>
